appId: app.evencleaner.development
productName: EvenCleaner Development
copyright: Copyright © 2026 Cleanly
directories:
  output: release
  buildResources: build
# main, preload and the Anthropic SDK are bundled by esbuild, so no node_modules ship in the app
files:
  - dist/**
  - dist-electron/**
  - package.json
asar: true
# no version in file names, so releases/latest/download/<name> links never go stale
artifactName: ${productName}-${os}-${arch}.${ext}
publish: null
beforePack: ./scripts/check-release.cjs

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: EvenCleaner Development
  artifactName: ${productName}-setup.${ext}
portable:
  artifactName: ${productName}-portable.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Packaging is blocked. Real Developer ID credentials and notarization are prerequisites.
  hardenedRuntime: true
  gatekeeperAssess: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDesktopFolderUsageDescription: Cleanly measures your Desktop to show what takes up space.
    NSDocumentsFolderUsageDescription: Cleanly measures your Documents to show what takes up space.
    NSDownloadsFolderUsageDescription: Cleanly looks for old downloads you may want to remove.
dmg:
  title: EvenCleaner Development
  sign: true
  contents:
    - { x: 150, y: 190 }
    - { x: 390, y: 190, type: link, path: /Applications }

linux:
  icon: build/icon.png
  target: [AppImage]
  category: Utility
